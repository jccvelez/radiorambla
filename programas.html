<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Rambla Torrenueva - Programas</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #111, #1a1a1a);
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #ccc;
      margin-bottom: 25px;
    }

    /* BOTÓN VOLVER */
    .volver-btn {
      margin-bottom: 35px;
    }

    .volver-btn a {
      display: inline-block;
      padding: 14px 24px;
      background: rgba(255,255,255,0.08);
      color: white;
      text-decoration: none;
      border-radius: 16px;
      font-weight: bold;
      transition: all 0.3s ease;
      backdrop-filter: blur(6px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .volver-btn a:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.12);
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
    }

    .audio-card {
      background: #1f1f1f;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: transform 0.3s ease,
                  background 0.3s ease;
    }

    .audio-card:hover {
      transform: translateY(-5px);
      background: #252525;
    }

    .audio-card h2 {
      margin-top: 0;
      color: white;
      font-size: 1.3rem;
    }

    audio {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }

    /* LOGOS */
    .logos {
  margin-top: 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 100%;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
}

.logos-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

  .logo-card {
  background: rgba(255,255,255,0.05);
  border-radius: 18px;
  padding: 15px;
  backdrop-filter: blur(6px);
  cursor: default;
}

    .logo-card img {
      width: 100%;
      max-height: 120px;
      object-fit: contain;
      filter: brightness(1.05);
    }

    footer {
      margin-top: 40px;
      color: #777;
      font-size: 0.9rem;
    }

    /* móvil */
    @media (max-width: 600px) {

      h1 {
        font-size: 1.5rem;
      }

      .logos {
        grid-template-columns: 1fr;
      }

      .logo-card img {
        max-height: 100px;
      }

      .audio-card {
        padding: 15px;
      }

      .volver-btn a {
        width: 100%;
        box-sizing: border-box;
      }
    }
  </style>
  <!-- Google Analytics -->
