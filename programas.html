<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Rambla Torrenueva - Programas</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #111, #1a1a1a);
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #ccc;
      margin-bottom: 35px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
    }

    .audio-card {
      background: #1f1f1f;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: transform 0.3s ease,
                  background 0.3s ease;
    }

    .audio-card:hover {
      transform: translateY(-5px);
      background: #252525;
    }

    .audio-card h2 {
      margin-top: 0;
      color: white;
      font-size: 1.3rem;
    }

    .date {
      color: #aaa;
      margin-bottom: 15px;
      font-size: 0.95rem;
    }

    audio {
      width: 100%;
      border-radius: 10px;
    }

    /* LOGOS */
    .logos {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .logo-card {
      background: rgba(255,255,255,0.05);
      border-radius: 18px;
      padding: 15px;
      transition: transform 0.3s ease,
                  background 0.3s ease;
      backdrop-filter: blur(6px);
    }

    .logo-card:hover {
      transform: translateY(-5px);
      background: rgba(255,255,255,0.08);
    }

    .logo-card img {
      width: 100%;
      max-height: 120px;
      object-fit: contain;
      filter: brightness(1.05);
    }

    footer {
      margin-top: 40px;
      color: #777;
      font-size: 0.9rem;
    }

    /* móvil */
    @media (max-width: 600px) {

      h1 {
        font-size: 1.5rem;
      }

      .logos {
        grid-template-columns: 1fr;
      }

      .logo-card img {
        max-height: 100px;
      }

      .audio-card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <h1>🎙️ Programas Grabados</h1>
  <div class="subtitle">Escucha los programas del día que quieras</div>

  <div class="container">

    <div class="audio-card">
      <h2>26 Mayo 2026</h2>
      <audio controls>
        <source src="audios/programa-2026-05-26.mp3" type="audio/mpeg">
        Tu navegador no soporta audio HTML5.
      </audio>
    </div>

    <div class="audio-card">
      <h2>25 Mayo 2026</h2>
      <audio controls>
        <source src="audios/especial-2026-05-25.mp3" type="audio/mpeg">
        Tu navegador no soporta audio HTML5.
      </audio>
    </div>

    <div class="audio-card">
      <h2>24 Mayo 2026</h2>
      <audio controls>
        <source src="audios/noticias-2026-05-24.mp3" type="audio/mpeg">
        Tu navegador no soporta audio HTML5.
      </audio>
    </div>

  </div>

  <!-- LOGOS -->
  <div class="logos">

    <div class="logo-card">
      <img src="https://raw.githubusercontent.com/jccvelez/radiorambla/refs/heads/main/logo-candil.png" alt="Asociación Cultural El Candil">
    </div>

    <div class="logo-card">
      <img src="https://raw.githubusercontent.com/jccvelez/radiorambla/refs/heads/main/logo-juvenil.png" alt="Asociación Juvenil">
    </div>

    <div class="logo-card">
      <img src="https://raw.githubusercontent.com/jccvelez/radiorambla/refs/heads/main/logo-ayuntamiento.png" alt="Ayuntamiento Torrenueva">
    </div>

    <div class="logo-card">
      <img src="https://raw.githubusercontent.com/jccvelez/radiorambla/refs/heads/main/logo-cultura.png" alt="Cultura Educación y Juventud">
    </div>

  </div>

  <footer>
    © 2026 Radio Rambla Torrenueva
  </footer>

</body>
</html>
