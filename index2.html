<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radio Rambla Torrenueva</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b0b0f;
  --card: rgba(255,255,255,0.06);
  --accent: #ff3b6b;
  --text: #ffffff;
  --muted: #9a9a9a;
}

body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: radial-gradient(circle at top, #1a1a2e, var(--bg));
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  text-align: center;
  padding: 20px;
}

/* HEADER */
h1 {
  font-size: 2.4rem;
  font-weight: 700;
  margin-top: 30px;
  letter-spacing: -0.5px;
}

h1::after {
  content: "🎧 En directo";
  display: block;
  font-size: 0.9rem;
  color: var(--accent);
  margin-top: 5px;
  font-weight: 600;
}

/* PLAYER */
.radio-player {
  width: 100%;
  max-width: 520px;
  background: var(--card);
  padding: 22px;
  border-radius: 20px;
  backdrop-filter: blur(12px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  margin-top: 25px;
  transition: transform 0.3s ease;
}

.radio-player:hover {
  transform: translateY(-4px);
}

/* BUTTONS */
.btn {
  display: inline-block;
  padding: 14px 22px;
  margin-top: 18px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: 600;
  transition: 0.25s ease;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #ff7aa2);
  color: white;
  box-shadow: 0 10px 25px rgba(255,59,107,0.3);
}

.btn-primary:hover {
  transform: scale(1.03);
}

.btn-secondary {
  background: rgba(255,255,255,0.08);
  color: white;
}

.btn-secondary:hover {
  background: rgba(255,255,255,0.14);
  transform: translateY(-2px);
}

/* LOGOS */
.logos {
  margin-top: 45px;
  width: 100%;
  max-width: 520px;
}

.logos-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin-bottom: 18px;
}

.logo-card {
  background: rgba(255,255,255,0.04);
  padding: 14px;
  border-radius: 16px;
  transition: 0.3s ease;
}

.logo-card:hover {
  transform: scale(1.03);
  background: rgba(255,255,255,0.08);
}

.logo-card img {
  width: 100%;
  max-height: 90px;
  object-fit: contain;
}

/* FOOTER */
footer {
  margin-top: 40px;
  color: var(--muted);
  font-size: 0.85rem;
}

/* MOBILE */
@media (max-width: 600px) {
  h1 { font-size: 1.8rem; }
}
</style>
</head>

<body>

<h1>Radio Rambla Torrenueva</h1>

<div class="radio-player">
  <script src="https://embed.radio.co/player/f8ba438.js"></script>
</div>

<a class="btn btn-secondary" href="programas.html">
🎙️ Programas grabados
</a>

<a class="btn btn-primary"
   href="https://wa.me/34669755506?text=Hola%20Radio%20Rambla"
   target="_blank">
💬 WhatsApp - Peticiones
</a>

<div class="logos">
  <div class="logos-row">
    <div class="logo-card"><img src="logo1.png"></div>
    <div class="logo-card"><img src="logo2.png"></div>
  </div>
  <div class="logos-row">
    <div class="logo-card"><img src="logo3.png"></div>
    <div class="logo-card"><img src="logo4.png"></div>
  </div>
</div>

<footer>
© 2026 Radio Rambla Torrenueva · Todos los derechos reservados
</footer>

</body>
</html>
